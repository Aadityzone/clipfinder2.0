name: CI
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: clipfinder-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    permissions:
      contents: write
      actions: write
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clipfinder
      AUTH_SECRET: ci-auth-secret-not-for-production
      AI_SERVICE_SECRET: ci-ai-secret-not-for-production
      AI_SERVICE_URL: http://127.0.0.1:8000
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_ROOT: ../storage
      NEXT_TELEMETRY_DISABLED: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --include=optional
      - name: Apply non-breaking npm security fixes
        continue-on-error: true
        run: npm audit fix
      - name: Upload npm audit-updated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-remediated-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Commit patched lockfile and rerun CI on the updated PR head
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(deps): commit compatible npm security updates'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
            gh workflow run ci.yml --ref "${GITHUB_HEAD_REF}"
          fi
      - name: Report npm dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e 'const r=require(process.env.RUNNER_TEMP+"/npm-audit.json"); for (const [name,v] of Object.entries(r.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,url:x.url,range:x.range})})); console.log("TOTALS",JSON.stringify(r.metadata?.vulnerabilities||{}))'
      - run: npm ls lightningcss lightningcss-linux-x64-gnu @tailwindcss/oxide @tailwindcss/oxide-linux-x64-gnu
      - run: npm run prisma:generate
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-ci.txt
      - run: python -m pip install --upgrade pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: python -m pip install -r ai/requirements-ci.txt
      - run: python -m py_compile ai/main.py ai/schemas.py ai/transcribe.py ai/highlights.py ai/longform.py ai/services/render.py ai/services/media_intelligence.py ai/services/audio_intelligence.py ai/services/llm.py ai/services/dedup.py ai/services/captions.py
      - run: PYTHONPATH=. pytest -q
