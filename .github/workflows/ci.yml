name: CI
on: [push, pull_request]

jobs:
  web:
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clipfinder
      AUTH_SECRET: ci-auth-secret-not-for-production
      AI_SERVICE_SECRET: ci-ai-secret-not-for-production
      AI_SERVICE_URL: http://127.0.0.1:8000
      APP_URL: http://localhost:3000
      MEDIA_STORAGE_ROOT: ../storage
      NEXT_TELEMETRY_DISABLED: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prisma:generate
      - run: npx prisma validate --schema prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ai/requirements.txt
      - run: python -m py_compile ai/main.py ai/schemas.py ai/transcribe.py ai/highlights.py ai/longform.py ai/services/render.py ai/services/media_intelligence.py ai/services/llm.py ai/services/dedup.py ai/services/captions.py
      - run: PYTHONPATH=. pytest -q
