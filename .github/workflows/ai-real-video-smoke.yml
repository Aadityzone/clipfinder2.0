name: Real AI Video Smoke Test

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public video URL you have permission to process
        required: true
        type: string
      genre:
        description: Content genre
        required: true
        type: choice
        options:
          - auto
          - gaming
          - irl_stream
          - movies_tv
          - anime
          - tech
          - knowledge
          - facts
          - podcast
        default: auto
      language:
        description: Optional Whisper language code (leave blank for auto-detect)
        required: false
        type: string
      top:
        description: Number of clips to render (1-10)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "10"
        default: "3"

permissions:
  contents: read

jobs:
  real-video-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      SOURCE_URL: ${{ inputs.source_url }}
      GENRE: ${{ inputs.genre }}
      LANGUAGE: ${{ inputs.language }}
      TOP: ${{ inputs.top }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements-ci.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install AI service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai/requirements-ci.txt
      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Run real source through transcription, ranking, and MP4 rendering
        shell: bash
        run: |
          args=(--url "$SOURCE_URL" --genre "$GENRE" --top "$TOP" --out-dir artifacts/ai-smoke)
          if [[ -n "$LANGUAGE" ]]; then
            args+=(--language "$LANGUAGE")
          fi
          PYTHONPATH=. python ai/scripts/smoke_pipeline.py "${args[@]}"
      - name: Upload transcript, report, and rendered clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipfinder-real-video-smoke
          path: artifacts/ai-smoke/
          if-no-files-found: warn
          retention-days: 7
